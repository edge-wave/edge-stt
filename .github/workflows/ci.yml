name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # whisper.cpp is C++, so this needs more than a Rust toolchain.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - if: runner.os == 'macOS'
        run: brew install cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Not --all-features: that turns on CUDA and Vulkan, which need
      # toolchains no runner here has.
      - run: cargo clippy --workspace --all-targets --features full -- -D warnings
      - run: cargo test --workspace --features full
      # The shape an embedder gets by default, with neither optional
      # capability on. What is promised to them is that nothing moves.
      - run: cargo test --workspace

  streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Isolated from `remote`: `full` already covers them combined,
      # this catches anything that only breaks with streaming alone.
      - run: cargo clippy -p edge-stt-core --all-targets --features streaming -- -D warnings
      - run: cargo test -p edge-stt-core --features streaming

  thin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A client that only talks to a server, built with no cmake at all.
      - name: Sessions build without the on-device recognizer
        continue-on-error: true
        run: cargo check -p edge-stt-core --no-default-features --features remote,streaming

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The offline claim, checked by the machine rather than by a
      # reviewer: no interfaces exist inside this namespace at all.
      # The binaries are run directly, because a nested sudo loses the
      # PATH that cargo lives on.
      - run: cargo test --no-run -p edge-stt-core
      - name: Run the tests where there is no network
        run: |
          cargo test --no-run -p edge-stt-core --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable | values' \
            | while read -r binary; do
                echo "== $binary"
                sudo unshare --net "$binary" < /dev/null
              done

  weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The operator supplies the weights. A tracked one means an ignore
      # rule failed, so the machine looks rather than the reviewer.
      - name: No model weights are tracked
        run: |
          tracked=$(git ls-files \
            | grep -Ei '\.(bin|gguf|ggml|pt|pth|onnx|safetensors)$' || true)
          if [ -n "$tracked" ]; then
            echo "these look like model weights and are tracked:"
            echo "$tracked"
            exit 1
          fi

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checksum record is what the fetch script trusts, so a row
      # that stops parsing would silently stop being checked.
      - name: The checksum record still reads
        run: |
          count=$(./scripts/fetch-model.sh --list | wc -l)
          [ "$count" -gt 0 ] || { echo "no models parsed out of the record"; exit 1; }
      # Whether the published file still hashes to what is written down.
      # Advisory: Hugging Face being down is not this branch being broken.
      - name: The smallest model still fetches and verifies
        continue-on-error: true
        run: ./scripts/fetch-model.sh --dir "$RUNNER_TEMP/models" tiny-q5_1

  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen
      - run: cargo test -p edge-stt-capi --test header_is_current -- --ignored
