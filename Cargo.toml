[workspace]
members = ["core", "capi", "py", "server"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edge-wave/edge-stt"
authors = ["The edge-stt Authors"]

[workspace.dependencies]
edge-stt-core = { path = "core", version = "0.4.1" }

whisper-rs = "0.16"
log = "0.4"
thiserror = "2"

tokio = "1.53"
tokio-tungstenite = "0.30"
futures-util = "0.3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

hound = "3.5.1"

pyo3 = "0.29.2"
pyo3-build-config = "0.29.2"
